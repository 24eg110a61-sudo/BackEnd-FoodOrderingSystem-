server.port=8080
server.error.include-message=always

spring.datasource.url=jdbc:h2:file:./data/fooddb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# To use MySQL instead: add mysql-connector-j to pom.xml and replace the datasource lines above:
# spring.datasource.url=jdbc:mysql://localhost:3306/fooddb
# spring.datasource.username=root
# spring.datasource.password=yourpassword
